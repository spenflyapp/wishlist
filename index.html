<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist Cumple 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#0B0713;
    --noche-2:#150D24;
    --morado:#2A1B4A;
    --morado-soft:#B9A7D8;
    --calabaza:#FF7A18;
    --calabaza-dark:#D95A0A;
    --ambar:#FFB13D;
    --brasa:#FF4D1C;
    --musgo:#5C8A3C;
    --corteza:#3A2418;
    --crema:#FFE9C9;
    --crema-soft:#C9B6A0;
    --r:22px;
    --shadow:0 20px 44px -18px rgba(0,0,0,.75);
    --shadow-hover:0 30px 66px -20px rgba(255,122,24,.45), 0 20px 44px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{scroll-behavior:smooth;background:var(--noche)}

  body{
    font-family:'DM Sans',sans-serif;
    color:var(--crema);
    background:transparent;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ FONDO: NOCHE DE OTOÑO ============ */

  /* cielo nocturno con horizonte cálido */
  .sky{
    position:fixed;inset:0;z-index:-9;
    background:
      radial-gradient(120% 70% at 50% 96%, rgba(255,122,24,.30) 0%, rgba(255,77,28,.10) 35%, rgba(0,0,0,0) 68%),
      linear-gradient(180deg,#07040F 0%,#130B26 28%,#241543 52%,#3B1E46 72%,#5E2B3C 88%,#7A3A2A 100%);
  }

  /* estrellas */
  .stars{position:fixed;inset:0 0 35% 0;z-index:-8;pointer-events:none;overflow:hidden}
  .star{
    position:absolute;border-radius:50%;background:#FFF6DF;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:.95;transform:scale(1)}
  }

  /* luna llena */
  .moon{
    position:fixed;top:5vh;left:76%;
    width:min(230px,38vw);aspect-ratio:1;
    margin-left:calc(min(230px,38vw) / -2);
    border-radius:50%;z-index:-7;
    background:
      radial-gradient(circle at 63% 31%, rgba(198,164,116,.55) 0 8%, rgba(0,0,0,0) 9%),
      radial-gradient(circle at 41% 63%, rgba(198,164,116,.45) 0 11%, rgba(0,0,0,0) 12%),
      radial-gradient(circle at 69% 67%, rgba(198,164,116,.38) 0 6%, rgba(0,0,0,0) 7%),
      radial-gradient(circle at 34% 27%, rgba(198,164,116,.30) 0 5%, rgba(0,0,0,0) 6%),
      radial-gradient(circle at 38% 34%, #FFF8E0 0%, #FFEBBC 42%, #F2D191 72%, #DBB272 100%);
    box-shadow:
      0 0 70px 18px rgba(255,214,138,.30),
      0 0 180px 70px rgba(255,140,50,.16);
    animation:moonGlow 9s ease-in-out infinite;
  }
  @keyframes moonGlow{
    0%,100%{box-shadow:0 0 70px 18px rgba(255,214,138,.28),0 0 180px 70px rgba(255,140,50,.14)}
    50%{box-shadow:0 0 92px 26px rgba(255,214,138,.42),0 0 220px 90px rgba(255,140,50,.22)}
  }

  /* nubes deshilachadas cruzando la luna */
  .clouds{position:fixed;inset:0 0 auto 0;height:60vh;z-index:-6;pointer-events:none;overflow:hidden}
  .cloud{
    position:absolute;height:70px;width:520px;
    background:radial-gradient(60% 100% at 30% 55%, rgba(60,40,80,.75), rgba(60,40,80,0) 70%),
               radial-gradient(55% 100% at 62% 45%, rgba(45,30,65,.7), rgba(45,30,65,0) 72%);
    filter:blur(8px);
    animation:drift linear infinite;
  }
  @keyframes drift{
    from{transform:translateX(-40vw)}
    to{transform:translateX(120vw)}
  }

  /* murciélagos */
  .bats{position:fixed;inset:0;z-index:-5;pointer-events:none;overflow:hidden}
  .bat{position:absolute;animation:batPath linear infinite}
  .bat svg{display:block;fill:#0C0714;animation:flap .28s ease-in-out infinite alternate}
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
  @keyframes batPath{
    0%{transform:translate(-12vw,0) rotate(-4deg)}
    25%{transform:translate(18vw,-5vh) rotate(5deg)}
    50%{transform:translate(48vw,3vh) rotate(-5deg)}
    75%{transform:translate(78vw,-4vh) rotate(4deg)}
    100%{transform:translate(112vw,1vh) rotate(-3deg)}
  }

  /* capas de bosque */
  .layer{
    position:fixed;left:0;width:100%;pointer-events:none;line-height:0;
    display:flex;justify-content:center;overflow:hidden;
  }
  /* el bosque escala con el ancho, pero nunca por debajo de 1100px:
     así la cabaña sigue viéndose en móvil (se recortan los laterales) */
  .layer svg{width:100%;min-width:1100px;flex:none;display:block}
  .layer.far{bottom:90px;z-index:-4;opacity:.85}
  .layer.mid{bottom:36px;z-index:-3}
  .layer.near{bottom:0;z-index:13}

  /* ventanas y fuego encendido */
  .flicker{animation:flick 3.1s ease-in-out infinite}
  .flicker-2{animation:flick 2.3s ease-in-out infinite .4s}
  @keyframes flick{
    0%,100%{opacity:1}
    18%{opacity:.72}
    26%{opacity:.95}
    44%{opacity:.6}
    58%{opacity:1}
    72%{opacity:.8}
  }
  .bulb{animation:bulbPulse 2.6s ease-in-out infinite}
  @keyframes bulbPulse{0%,100%{opacity:1}50%{opacity:.45}}
  .smoke{animation:smokeUp 7s ease-out infinite;transform-origin:center}
  @keyframes smokeUp{
    0%{opacity:0;transform:translate(0,0) scale(.5)}
    15%{opacity:.5}
    100%{opacity:0;transform:translate(-26px,-110px) scale(2.6)}
  }

  /* niebla */
  .fog{
    position:fixed;left:0;width:200%;pointer-events:none;
    background:
      /* el patrón se repite cada 50% para que el bucle sea invisible */
      radial-gradient(22% 100% at 12% 60%, rgba(200,180,220,.16), rgba(0,0,0,0) 70%),
      radial-gradient(22% 100% at 62% 60%, rgba(200,180,220,.16), rgba(0,0,0,0) 70%),
      radial-gradient(18% 100% at 34% 46%, rgba(255,200,160,.13), rgba(0,0,0,0) 70%),
      radial-gradient(18% 100% at 84% 46%, rgba(255,200,160,.13), rgba(0,0,0,0) 70%);
    filter:blur(6px);
  }
  .fog.a{bottom:60px;height:180px;z-index:-2;animation:fogSlide 48s linear infinite}
  .fog.b{bottom:0;height:150px;z-index:14;animation:fogSlide 34s linear infinite reverse;opacity:.85}
  @keyframes fogSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* suelo del bosque: aquí las tarjetas se hunden entre la hojarasca */
  .ground-body{
    position:fixed;bottom:0;left:0;width:100%;height:52px;z-index:15;
    background:
      radial-gradient(60% 200% at 30% 0%, rgba(255,122,24,.10), rgba(0,0,0,0) 70%),
      linear-gradient(180deg,#0A0610,#060310);
    pointer-events:none;
  }
  .litter{position:fixed;bottom:0;left:0;width:100%;z-index:15;line-height:0;pointer-events:none}
  .litter svg{width:100%;height:140px;display:block}
  /* detrás del plano medio: es una loma lejana, no debe cortar la cabaña */
  .litter.back{z-index:-4;opacity:.9}
  .litter.front{z-index:16}

  /* hojas cayendo */
  .leaves{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

  /* telarañas de esquina */
  .web{position:fixed;top:0;width:190px;z-index:18;pointer-events:none;opacity:.22}
  .web.l{left:0}
  .web.r{right:0;transform:scaleX(-1)}
  .spider{
    position:fixed;top:0;right:16vw;z-index:18;pointer-events:none;
    animation:hang 9s ease-in-out infinite;
  }
  @keyframes hang{
    0%,100%{transform:translateY(-160px)}
    45%,65%{transform:translateY(14vh)}
  }

  /* viñeta para dar profundidad al bosque */
  .vignette{
    position:fixed;inset:0;z-index:17;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 45%, rgba(6,3,12,.55) 100%);
  }

  /* ============ LAYOUT ============ */
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

  header.hero{
    text-align:center;
    padding:80px 22px 46px;
    min-height:92vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;z-index:2;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(26,14,40,.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,177,61,.35);
    color:var(--ambar);
    font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 16px;border-radius:50px;
    box-shadow:0 0 26px -6px rgba(255,122,24,.5);
    animation:dropIn .7s .1s backwards;
  }
  /* el hero es flex column: sin esto los hijos se dimensionan a max-content
     y el título / las stats desbordan en móvil en vez de envolver */
  .hero h1,.hero p.sub,.stats{width:100%;max-width:100%}
  .hero h1{
    font-family:'Creepster',cursive;
    font-weight:400;
    font-size:clamp(2.5rem,6.2vw,4.6rem);
    line-height:1.02;
    margin:20px 0 16px;
    color:var(--crema);
    letter-spacing:.02em;
    text-shadow:0 0 28px rgba(255,140,50,.35),0 0 16px rgba(0,0,0,.6),0 6px 0 rgba(0,0,0,.35);
  }
  .hero h1 .pop{
    color:var(--calabaza);
    display:inline-block;
    text-shadow:0 0 18px rgba(255,122,24,.9),0 0 46px rgba(255,77,28,.6);
    animation:wiggle 3.5s ease-in-out infinite, glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-2deg)}
    50%{transform:rotate(2deg)}
  }
  @keyframes glowPulse{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.22)}
  }
  .hero p.sub{
    font-size:clamp(1rem,2.2vw,1.2rem);
    color:var(--morado-soft);
    max-width:560px;margin:0 auto;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
    animation:dropIn .7s .35s backwards;
  }
  @keyframes dropIn{
    from{opacity:0;transform:translateY(-14px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* contador resumen */
  .stats{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    margin-top:30px;
    animation:dropIn .7s .5s backwards;
  }
  .stat{
    background:linear-gradient(160deg,rgba(42,27,74,.82),rgba(16,9,28,.88));
    border-radius:18px;padding:14px 22px;
    box-shadow:var(--shadow);min-width:120px;
    border:1px solid rgba(255,177,61,.22);
    backdrop-filter:blur(5px);
  }
  .stat b{font-family:'Creepster',cursive;font-size:1.7rem;color:var(--ambar);display:block;line-height:1.1;letter-spacing:.03em}
  .stat span{font-size:.76rem;color:var(--crema-soft);font-weight:500;letter-spacing:.04em}

  /* indicador para bajar a la lista */
  /* a la derecha: el centro-izquierda lo ocupa la cabaña */
  .scroll-hint{
    position:absolute;bottom:14px;right:7%;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    color:var(--ambar);text-decoration:none;
    font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
    opacity:.8;transition:opacity .3s,color .3s;
    animation:dropIn .7s .7s backwards;
  }
  .scroll-hint:hover{opacity:1;color:var(--calabaza)}
  .scroll-hint svg{animation:bob 2s ease-in-out infinite}
  @keyframes bob{
    0%,100%{transform:translateY(0);opacity:.7}
    50%{transform:translateY(6px);opacity:1}
  }
  .anchor{display:block;position:relative;top:-90px;height:0}

  /* ============ FILTROS ============ */
  .controls{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin:46px 0 8px;
    position:sticky;top:0;z-index:30;
    padding:14px 0;
  }
  .controls::before{
    /* franja a sangre, difuminada por arriba y por abajo (sin cantos duros).
       El margen superior de 44px queda fuera de pantalla al quedar fija arriba,
       así que sigue tapando por completo lo que pasa por detrás. */
    content:"";position:absolute;top:-44px;bottom:-30px;
    left:50%;width:100vw;transform:translateX(-50%);
    background:rgba(11,7,19,.90);
    backdrop-filter:blur(7px);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 30%,#000 72%,rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 30%,#000 72%,rgba(0,0,0,0) 100%);
    z-index:-1;
  }
  .chip{
    font-family:'DM Sans';font-weight:600;font-size:.9rem;
    border:2px solid rgba(255,177,61,.4);
    background:rgba(21,13,36,.9);color:var(--crema);
    padding:9px 18px;border-radius:50px;cursor:pointer;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s,box-shadow .25s,border-color .25s;
  }
  .chip:hover{transform:translateY(-3px) scale(1.04);border-color:var(--calabaza)}
  .chip.active{
    background:linear-gradient(180deg,var(--calabaza),var(--calabaza-dark));
    border-color:var(--ambar);color:#20100A;
    box-shadow:0 0 26px -4px rgba(255,122,24,.8);
  }
  .chip:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}

  /* ============ TARJETAS ============ */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:26px;
    padding:30px 0 200px;
    position:relative;z-index:1;
  }
  .card{
    /* cartel de madera: vetas finas + juntas entre tablas */
    background:
      repeating-linear-gradient(92deg,
        rgba(0,0,0,.15) 0 1px,rgba(255,226,178,.035) 1px 3px,rgba(0,0,0,0) 3px 13px),
      repeating-linear-gradient(180deg,
        rgba(0,0,0,.45) 0 3px,rgba(255,214,160,.07) 3px 5px,rgba(0,0,0,0) 5px 58px),
      linear-gradient(168deg,#5C3A22 0%,#452A18 46%,#33200F 100%);
    border-radius:14px;overflow:hidden;
    position:relative;
    display:flex;flex-direction:column;
    padding:13px 13px 15px;
    border:2px solid #24140A;
    box-shadow:
      inset 0 1px 0 rgba(255,220,170,.16),
      inset 0 -5px 12px rgba(0,0,0,.45),
      var(--shadow);
    transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s;
    opacity:0;transform:translateY(60px) scale(.96);
  }
  /* los cuatro clavos del cartel */
  .card::before,.card::after,
  .card .body::before,.card .body::after{
    content:"";position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#E8D3A8,#8A7048 48%,#2E2210 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.8),inset 0 -1px 1px rgba(0,0,0,.5);
    z-index:3;pointer-events:none;
  }
  .card::before{top:7px;left:7px}
  .card::after{top:7px;right:7px}
  .card .body::before{bottom:7px;left:7px}
  .card .body::after{bottom:7px;right:7px}
  .card.in{opacity:1;transform:translateY(0) scale(1);
    transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1);}
  .card:hover{
    transform:translateY(-10px) rotate(-.5deg);
    box-shadow:
      inset 0 1px 0 rgba(255,220,170,.22),
      inset 0 -5px 12px rgba(0,0,0,.4),
      var(--shadow-hover);
  }

  .card .ph{
    position:relative;aspect-ratio:16/11;overflow:hidden;
    border-radius:8px;background:#1B1128;
    border:2px solid #1E1008;
    box-shadow:0 5px 14px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,214,160,.10);
  }
  .card .ph img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(.85) brightness(.78) contrast(1.05) sepia(.12);
    transition:transform .7s cubic-bezier(.22,1,.36,1),filter .5s;
  }
  .card:hover .ph img{transform:scale(1.09);filter:saturate(1) brightness(1) contrast(1) sepia(0)}
  .card .ph::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(12,7,20,.35) 0%,rgba(12,7,20,0) 35%,rgba(12,7,20,.85) 100%),
      radial-gradient(90% 70% at 50% 0%, rgba(255,122,24,.20), rgba(0,0,0,0) 70%);
    transition:opacity .5s;
  }
  .card:hover .ph::after{opacity:.55}

  .badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap;z-index:2}
  .badge{
    font-size:.72rem;font-weight:700;letter-spacing:.02em;
    padding:5px 11px;border-radius:50px;color:var(--crema);
    backdrop-filter:blur(3px);
    box-shadow:0 4px 12px -4px rgba(0,0,0,.7);
  }
  .badge.cat{background:rgba(42,27,74,.85);border:1px solid rgba(255,177,61,.3)}
  .prio{
    position:absolute;top:12px;right:12px;z-index:2;
    font-size:.72rem;font-weight:700;
    padding:5px 11px 5px 24px;border-radius:50px;color:#fff;
    box-shadow:0 4px 14px -4px rgba(0,0,0,.7);
  }
  .prio::before{
    content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;
    margin-top:-4px;border-radius:50%;background:#fff;
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .prio.alta{background:linear-gradient(180deg,var(--calabaza),var(--calabaza-dark));color:#1E0E06}
  .prio.media{background:linear-gradient(180deg,#6FA046,#41682A)}
  .prio.baja{background:linear-gradient(180deg,#6A4E9C,#3B2A63)}

  .card .body{padding:15px 6px 8px;display:flex;flex-direction:column;flex:1}
  .card h3{
    font-family:'Fredoka';font-weight:600;font-size:1.2rem;line-height:1.2;
    margin-bottom:8px;color:var(--crema);text-shadow:0 1px 0 rgba(0,0,0,.6);
  }
  .card .desc{font-size:.9rem;color:var(--crema-soft);line-height:1.5;flex:1}

  .price{
    font-family:'Creepster',cursive;font-weight:400;font-size:1.6rem;color:var(--ambar);
    letter-spacing:.03em;
    margin:16px 0 14px;display:flex;align-items:baseline;gap:7px;
    text-shadow:0 0 18px rgba(255,177,61,.35);
  }
  .price small{font-family:'DM Sans';font-size:.74rem;font-weight:500;color:var(--crema-soft);letter-spacing:0}
  .price.tbd{color:var(--morado-soft);text-shadow:none;font-size:1.25rem}

  .links{display:flex;gap:9px;flex-wrap:wrap}
  .links a{
    flex:1 1 auto;text-align:center;text-decoration:none;
    font-weight:600;font-size:.86rem;
    padding:10px 14px;border-radius:9px;
    background:linear-gradient(180deg,#2E1B0E,#1B0F07);
    border:1px solid rgba(255,177,61,.30);
    box-shadow:inset 0 1px 0 rgba(255,214,160,.13),0 2px 6px rgba(0,0,0,.5);
    color:var(--crema);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,box-shadow .25s,color .25s;
    position:relative;overflow:hidden;
  }
  .links a:hover{
    transform:translateY(-3px);
    background:linear-gradient(180deg,var(--calabaza),var(--calabaza-dark));
    color:#20100A;
    box-shadow:0 0 22px -4px rgba(255,122,24,.85);
  }
  .links a:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
  .links a::after{
    content:"↗";margin-left:6px;display:inline-block;
    transition:transform .25s;
  }
  .links a:hover::after{transform:translate(3px,-3px)}

  /* estado vacío / carga */
  .msg{
    grid-column:1/-1;text-align:center;padding:60px 20px;
    color:var(--crema-soft);font-size:1.05rem;
  }
  .msg b{color:var(--ambar)}
  .loader{
    width:46px;height:46px;border-radius:50%;margin:0 auto 18px;
    border:5px solid rgba(255,177,61,.18);border-top-color:var(--calabaza);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{
    text-align:center;padding:30px 22px 60px;
    color:var(--crema-soft);font-size:.86rem;
    position:relative;z-index:20;
    text-shadow:0 2px 10px rgba(0,0,0,.8);
  }
  footer b{color:var(--calabaza)}

  @media (max-width:1120px){
    .web{display:none}
    .spider{display:none}
  }

  @media (max-width:680px){
    header.hero{padding:64px 18px 40px}
    .scroll-hint{right:50%;transform:translateX(50%)}
    .scroll-hint span{display:none}
    .card{padding:11px 11px 13px}
    .card .body{padding:13px 4px 6px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
    .card{opacity:1;transform:none}
  }
</style>
</head>

    <svg width="22" height="13" viewBox="0 0 22 13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2 L11 11 L20 2"/></svg>
  </a>
</header>

<div class="wrap">
  <span id="lista" class="anchor" aria-hidden="true"></span>
  <nav class="controls" id="controls" aria-label="Filtrar regalos"></nav>

  <main class="grid" id="grid">
    <div class="msg"><div class="loader"></div>Buscando la lista entre la hojarasca…</div>
  </main>
</div>

<script>
const $ = (s,c=document)=>c.querySelector(s);
const $$ = (s,c=document)=>[...c.querySelectorAll(s)];
const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- estrellas ---------- */
(function(){
  const box=$('#stars');
  const n = reduceMotion ? 40 : 90;
  let html='';
  for(let i=0;i<n;i++){
    const s=(Math.random()*2.2+.8).toFixed(2);
    html+=`<span class="star" style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;
      width:${s}px;height:${s}px;animation-delay:${(-Math.random()*4).toFixed(2)}s;
      animation-duration:${(2.5+Math.random()*4).toFixed(2)}s;opacity:${(.2+Math.random()*.7).toFixed(2)}"></span>`;
  }
  box.innerHTML=html;
})();

/* ---------- hojas de otoño + brasas ---------- */
(function(){
  if(reduceMotion) return;
  const cv=$('#lv'), ctx=cv.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  }
  resize(); addEventListener('resize',resize);

  const rand=(a,b)=>a+Math.random()*(b-a);
  const LEAF_COLORS=['#C75B12','#E08A1E','#A8330E','#8E5A15','#D4471B','#7A3B12','#E0A93B','#6E2F10'];

  const leaves=[], embers=[];

  function newLeaf(y){
    return {
      x:rand(0,W), y:y??rand(-H*.4,-20),
      size:rand(7,15)*DPR,
      vy:rand(.5,1.5)*DPR,
      sway:rand(.6,2.1)*DPR,
      swaySpeed:rand(.008,.022),
      phase:rand(0,Math.PI*2),
      rot:rand(0,Math.PI*2),
      vrot:rand(-.028,.028),
      color:LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0],
      alpha:rand(.55,1)
    };
  }
  function newEmber(){
    return {
      x:rand(W*.32,W*.68), y:H*rand(.86,1.0),
      r:rand(1.1,2.6)*DPR,
      vy:rand(-.5,-1.4)*DPR, vx:rand(-.35,.35)*DPR,
      life:1, decay:rand(.003,.008),
      color:Math.random()<.35?'#FFD36B':'#FF7A18'
    };
  }

  const LEAF_N = innerWidth<720 ? 26 : 48;
  for(let i=0;i<LEAF_N;i++) leaves.push(newLeaf());
  for(let i=0;i<18;i++) embers.push(newEmber());

  function drawLeaf(l){
    const s=l.size;
    ctx.save();
    ctx.translate(l.x,l.y);
    ctx.rotate(l.rot);
    ctx.globalAlpha=l.alpha;
    ctx.fillStyle=l.color;
    ctx.beginPath();
    ctx.moveTo(0,-s);
    ctx.bezierCurveTo(s*.95,-s*.45, s*.95, s*.5, 0, s);
    ctx.bezierCurveTo(-s*.95, s*.5, -s*.95,-s*.45, 0,-s);
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)';
    ctx.lineWidth=Math.max(1,s*.09);
    ctx.beginPath(); ctx.moveTo(0,-s*.9); ctx.lineTo(0,s*.9); ctx.stroke();
    ctx.restore();
  }

  function tick(){
    ctx.clearRect(0,0,W,H);

    for(let i=0;i<leaves.length;i++){
      const l=leaves[i];
      l.phase+=l.swaySpeed;
      l.x+=Math.sin(l.phase)*l.sway;
      l.y+=l.vy;
      l.rot+=l.vrot;
      if(l.y-l.size>H) leaves[i]=newLeaf(-20);
      else if(l.x<-40) l.x=W+30;
      else if(l.x>W+40) l.x=-30;
      else drawLeaf(l);
    }

    ctx.globalAlpha=1;
    for(let i=0;i<embers.length;i++){
      const e=embers[i];
      e.x+=e.vx; e.y+=e.vy; e.vy*=.995;
      e.life-=e.decay;
      if(e.life<=0 || e.y<H*.35){ embers[i]=newEmber(); continue; }
      ctx.globalAlpha=Math.max(e.life,0)*(.5+Math.random()*.5);
      ctx.fillStyle=e.color;
      ctx.shadowColor=e.color; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill();
    }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ---------- parallax suave del bosque ---------- */
(function(){
  if(reduceMotion) return;
  const far=$('#lFar'), mid=$('#lMid'), moon=$('#moon');
  let ticking=false;
  function update(){
    const y=scrollY;
    far.style.transform =`translateY(${y*.030}px)`;
    mid.style.transform =`translateY(${y*.060}px)`;
    moon.style.transform=`translateY(${y*-.020}px)`;
    ticking=false;
  }
  addEventListener('scroll',()=>{
    if(!ticking){ requestAnimationFrame(update); ticking=true; }
  },{passive:true});
})();

/* ---------- datos ---------- */
const PRIO_ORDER={alta:0,media:1,baja:2};
const PRIO_LABEL={alta:'Imprescindible',media:'Prioridad media',baja:'Prioridad baja'};
let DATA=null, activeCat='Todo';

const num = v => { const n = typeof v==='number' ? v : parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : null; };
const fmt = (n,cur)=> new Intl.NumberFormat('es-ES').format(n)+' '+cur;

async function load(){
  try{
    const res = await fetch('wishlist.json',{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    DATA = await res.json();
    render();
  }catch(e){
    $('#grid').innerHTML =
      `<div class="msg">🕸️ No pude leer <b>wishlist.json</b>.<br>
       Asegúrate de abrir la web desde un servidor (o que el archivo esté al lado del HTML).</div>`;
    console.error(e);
  }
}

function render(){
  $('#titulo').innerHTML = DATA.titulo.replace('Wishlist','<span class="pop">Wishlist</span>');
  $('#subtitulo').textContent = DATA.subtitulo;

  const cur = DATA.moneda||'€';
  const items = DATA.regalos;
  const total = items.reduce((a,r)=>a+(num(r.precio)||0),0);
  const altas = items.filter(r=>r.prioridad==='alta').length;

  $('#stats').innerHTML = `
    <div class="stat"><b>${items.length}</b><span>deseos</span></div>
    <div class="stat"><b>${altas}</b><span>imprescindibles</span></div>
    <div class="stat"><b>${fmt(total,cur)}</b><span>valor total</span></div>`;

  // filtros
  const cats=['Todo',...new Set(items.map(r=>r.categoria))];
  $('#controls').innerHTML = cats.map(c=>
    `<button class="chip${c===activeCat?' active':''}" data-cat="${c}">${c}</button>`).join('');
  $$('#controls .chip').forEach(ch=>ch.onclick=()=>{
    activeCat=ch.dataset.cat;
    $$('#controls .chip').forEach(x=>x.classList.toggle('active',x===ch));
    paint();
  });

  paint();
}

function paint(){
  const cur = DATA.moneda||'€';
  let items=[...DATA.regalos].sort((a,b)=>
    (PRIO_ORDER[a.prioridad]??9)-(PRIO_ORDER[b.prioridad]??9) || (num(b.precio)||0)-(num(a.precio)||0));
  if(activeCat!=='Todo') items=items.filter(r=>r.categoria===activeCat);

  const grid=$('#grid');
  if(!items.length){grid.innerHTML='<div class="msg">No hay nada en esta categoría 🕷️</div>';return;}

  grid.innerHTML = items.map(r=>{
    const links=(r.links||[])
      .filter(l=>l.url)
      .map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.tienda}</a>`).join('');
    const p = num(r.precio);
    const precio = p===null
      ? `<div class="price tbd">Precio por confirmar</div>`
      : `<div class="price">${fmt(p,cur)} <small>máximo</small></div>`;
    return `
    <article class="card">
      <div class="ph">
        <div class="badges"><span class="badge cat">${r.categoria}</span></div>
        <span class="prio ${r.prioridad}">${PRIO_LABEL[r.prioridad]||r.prioridad}</span>
        <img src="${r.foto}" alt="${r.nombre}" loading="lazy"
             onerror="this.style.opacity=0;this.parentElement.style.background='linear-gradient(135deg,#3A2418,#C75B12 55%,#2A1B4A)'">
      </div>
      <div class="body">
        <h3>${r.nombre}</h3>
        <p class="desc">${r.descripcion||''}</p>
        ${precio}
        <div class="links">${links||'<span class="desc">Sin links aún</span>'}</div>
      </div>
    </article>`;
  }).join('');

  // reveal al hacer scroll
  const cards=$$('.card');
  if(reduceMotion){cards.forEach(c=>c.classList.add('in'));return;}
  const io=new IntersectionObserver((entries,obs)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        setTimeout(()=>en.target.classList.add('in'), cards.indexOf(en.target)%4*70);
        obs.unobserve(en.target);
      }
    });
  },{threshold:.12});
  cards.forEach(c=>io.observe(c));
}

load();
</script>
</body>
</html>
